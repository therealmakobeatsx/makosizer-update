name: Plugin builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libxext-dev libxfixes-dev libgtk-3-dev
      - name: Configure and build VST3
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target MakosizerX_VST3 --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-Linux-VST3
          path: build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build VST3
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target MakosizerX_VST3 --parallel 2
      - name: Package Windows VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build\MakosizerX_artefacts\Release\VST3\MakosizerX.vst3'
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) {
            throw "Expected VST3 bundle was not built: $bundle"
          }

          $output = Join-Path $env:GITHUB_WORKSPACE 'dist\windows'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $archivePath = Join-Path $output 'MakosizerX-Windows-VST3.zip'
          Compress-Archive -LiteralPath $bundle -DestinationPath $archivePath -CompressionLevel Optimal -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            if (-not ($archive.Entries | Where-Object { $_.FullName -like 'MakosizerX.vst3/Contents/*' })) {
              throw 'The Windows VST3 archive is missing the bundle contents.'
            }
          } finally {
            $archive.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-Windows-VST3
          path: |
            build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3
            dist/windows/MakosizerX-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build VST3 and AU
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release --target MakosizerX_VST3 MakosizerX_AU --parallel 2
      - name: Verify universal bundles and package archives
        shell: bash
        run: |
          set -euo pipefail
          vst3="build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3"
          au="build/MakosizerX_artefacts/Release/AU/MakosizerX.component"

          for bundle in "$vst3" "$au"; do
            test -d "$bundle" || { echo "Missing bundle: $bundle" >&2; exit 1; }
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
              "$bundle/Contents/Info.plist")
            binary="$bundle/Contents/MacOS/$executable"
            architectures=$(lipo -archs "$binary")
            [[ " $architectures " == *" arm64 "* ]] || {
              echo "Missing arm64 architecture in $binary: $architectures" >&2
              exit 1
            }
            [[ " $architectures " == *" x86_64 "* ]] || {
              echo "Missing x86_64 architecture in $binary: $architectures" >&2
              exit 1
            }
          done

          mkdir -p dist/macos
          ditto -c -k --sequesterRsrc --keepParent "$vst3" \
            dist/macos/MakosizerX-macOS-VST3.zip
          ditto -c -k --sequesterRsrc --keepParent "$au" \
            dist/macos/MakosizerX-macOS-AU.zip
          unzip -tq dist/macos/MakosizerX-macOS-VST3.zip
          unzip -tq dist/macos/MakosizerX-macOS-AU.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-macOS-VST3
          path: |
            build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3
            dist/macos/MakosizerX-macOS-VST3.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-macOS-AU
          path: |
            build/MakosizerX_artefacts/Release/AU/MakosizerX.component
            dist/macos/MakosizerX-macOS-AU.zip
          if-no-files-found: error
          retention-days: 30
