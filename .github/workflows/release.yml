name: MakosizerX Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: makosizerx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve semantic version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release notes range
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_version="$(tr -d '[:space:]' < VERSION.txt)"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "version=$base_version" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF" == refs/tags/* ]]; then
            if [[ ! "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH: $REF_NAME" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
          else
            current_tag="$(git tag --points-at "$COMMIT_SHA" --sort=-version:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -n "$current_tag" ]]; then
              version="${current_tag#v}"
            else
              if [[ -n "$latest_tag" ]]; then
                base_version="${latest_tag#v}"
                commits="$(git log "$latest_tag..$COMMIT_SHA" --format='%s%n%b')"
              else
                commits="$(git log "$COMMIT_SHA" --format='%s%n%b')"
              fi

              if [[ ! "$base_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "VERSION must use MAJOR.MINOR.PATCH: $base_version" >&2
                exit 1
              fi
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"

              if grep -Eq '^[[:alpha:]][[:alnum:]-]*(\([^)]*\))?!:|^BREAKING CHANGE:' <<< "$commits"; then
                version="$((major + 1)).0.0"
              elif grep -Eq '^feat(\([^)]*\))?:' <<< "$commits"; then
                version="$major.$((minor + 1)).0"
              else
                version="$major.$minor.$((patch + 1))"
              fi
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Resolved MakosizerX version: $version"

  linux:
    name: Linux VST3 and Standalone
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libxext-dev libxfixes-dev libgtk-3-dev

      - name: Configure, build, and test Release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DMAKOSIZERX_VERSION="$VERSION" -DBUILD_TESTING=ON
          cmake --build build --config Release \
            --target MakosizerX_VST3 MakosizerX_Standalone MakosizerXDSPTests --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Package Linux downloads
        shell: bash
        run: |
          set -euo pipefail
          vst3="build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3"
          standalone="build/MakosizerX_artefacts/Release/Standalone/MakosizerX"
          stage="dist/linux/MakosizerX"
          mkdir -p "$stage"
          test -d "$vst3" || { echo "Missing VST3 bundle: $vst3" >&2; exit 1; }
          test -x "$standalone" || { echo "Missing standalone executable: $standalone" >&2; exit 1; }
          cp -a "$vst3" "$stage/"
          install -m 755 "$standalone" "$stage/MakosizerX"
          cp LICENSE README.md "$stage/"
          (
            cd dist/linux
            zip -qr MakosizerX-Linux.zip MakosizerX
            tar -czf MakosizerX-Linux.tar.gz MakosizerX
          )
          unzip -tq dist/linux/MakosizerX-Linux.zip
          tar -tzf dist/linux/MakosizerX-Linux.tar.gz \
            | grep '^MakosizerX/MakosizerX.vst3/Contents/' >/dev/null
          test -s dist/linux/MakosizerX-Linux.zip
          test -s dist/linux/MakosizerX-Linux.tar.gz

      - name: Upload Linux build bundles
        uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-Linux-Build
          path: |
            build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3
            build/MakosizerX_artefacts/Release/Standalone/MakosizerX
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-Linux-Packages
          path: |
            dist/linux/MakosizerX-Linux.zip
            dist/linux/MakosizerX-Linux.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows VST3 and Standalone
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure, build, and test Release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release `
            -DMAKOSIZERX_VERSION="$env:VERSION" -DBUILD_TESTING=ON
          cmake --build build --config Release `
            --target MakosizerX_VST3 MakosizerX_Standalone MakosizerXDSPTests --parallel 2
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows downloads and optional signing
        shell: pwsh
        env:
          MAKOSIZERX_VERSION: ${{ needs.version.outputs.version }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build\MakosizerX_artefacts\Release\VST3\MakosizerX.vst3'
          $standalone = Join-Path $env:GITHUB_WORKSPACE 'build\MakosizerX_artefacts\Release\Standalone\MakosizerX.exe'
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) {
            throw "Expected VST3 bundle was not built: $bundle"
          }
          if (-not (Test-Path -LiteralPath $standalone -PathType Leaf)) {
            throw "Expected standalone executable was not built: $standalone"
          }

          $output = Join-Path $env:GITHUB_WORKSPACE 'dist\windows'
          $stage = Join-Path $output 'MakosizerX'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $certificatePath = $null
          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Host 'Windows signing credentials are not configured; publishing unsigned packages.'
          } elseif ($null -eq $signTool) {
            Write-Warning 'SignTool is unavailable; publishing unsigned packages.'
          } else {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'MakosizerX-signing.pfx'
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            $filesToSign = @(
              Get-ChildItem -LiteralPath $bundle -Recurse -File |
                Where-Object { $_.Extension -in @('.dll', '.exe') } |
                ForEach-Object { $_.FullName }
            ) + @($standalone)
            foreach ($file in $filesToSign) {
              & $signTool.Source sign /fd SHA256 /f $certificatePath `
                /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com `
                /td SHA256 $file
              if ($LASTEXITCODE -ne 0) { throw "Windows signing failed for $file" }
            }
          }

          try {
            Copy-Item -LiteralPath $bundle -Destination $stage -Recurse
            Copy-Item -LiteralPath $standalone -Destination $stage
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') -Destination $stage
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Destination $stage

            Compress-Archive -Path (Join-Path $stage '*') `
              -DestinationPath (Join-Path $output 'MakosizerX-Windows.zip') `
              -CompressionLevel Optimal -Force

            $env:MAKOSIZERX_VST3_PATH = (Resolve-Path -LiteralPath $bundle).Path
            choco install innosetup --yes --no-progress
            & iscc.exe (Join-Path $env:GITHUB_WORKSPACE 'MakosizerX.iss') "/O$output"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

            $installer = Join-Path $output 'MakosizerX Setup.exe'
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw 'Inno Setup did not create MakosizerX Setup.exe'
            }
            if ($certificatePath) {
              & $signTool.Source sign /fd SHA256 /f $certificatePath `
                /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com `
                /td SHA256 $installer
              if ($LASTEXITCODE -ne 0) { throw 'Windows installer signing failed.' }
            }

            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archivePath = Join-Path $output 'MakosizerX-Windows.zip'
            $archive = [IO.Compression.ZipFile]::OpenRead($archivePath)
            try {
              if (-not ($archive.Entries | Where-Object { $_.FullName -like 'MakosizerX.vst3/Contents/*' })) {
                throw 'MakosizerX-Windows.zip is missing the VST3 bundle contents.'
              }
            } finally {
              $archive.Dispose()
            }
          } finally {
            if ($certificatePath -and (Test-Path -LiteralPath $certificatePath)) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Upload Windows build bundles
        uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-Windows-Build
          path: |
            build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3
            build/MakosizerX_artefacts/Release/Standalone/MakosizerX.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-Windows-Packages
          path: |
            dist/windows/MakosizerX-Windows.zip
            dist/windows/MakosizerX Setup.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS VST3, Audio Unit, and Standalone
    needs: version
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Configure, build, and test universal Release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DMAKOSIZERX_VERSION="$VERSION" -DBUILD_TESTING=ON
          cmake --build build --config Release \
            --target MakosizerX_VST3 MakosizerX_AU MakosizerX_Standalone MakosizerXDSPTests \
            --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Sign macOS bundles when credentials are available
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" || \
                -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "macOS signing credentials are not configured; publishing unsigned packages."
            exit 0
          fi

          keychain="$RUNNER_TEMP/makosizerx-signing.keychain-db"
          certificate="$RUNNER_TEMP/makosizerx-signing.p12"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
          }
          trap cleanup EXIT

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"

          vst3="build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3"
          au="build/MakosizerX_artefacts/Release/AU/MakosizerX.component"
          standalone="build/MakosizerX_artefacts/Release/Standalone/MakosizerX.app"
          for bundle in "$vst3" "$au" "$standalone"; do
            if [[ -e "$bundle" ]]; then
              codesign --force --options runtime --timestamp \
                --keychain "$keychain" --sign "$MACOS_SIGNING_IDENTITY" "$bundle"
              codesign --verify --deep --strict --verbose=2 "$bundle"
            fi
          done

      - name: Package macOS downloads and optional notarization
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          vst3="build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3"
          au="build/MakosizerX_artefacts/Release/AU/MakosizerX.component"
          standalone="build/MakosizerX_artefacts/Release/Standalone/MakosizerX.app"
          stage="dist/macos/MakosizerX"
          mkdir -p "$stage/VST3" "$stage/Audio Unit"
          test -d "$vst3" || { echo "Missing VST3 bundle: $vst3" >&2; exit 1; }
          test -d "$au" || { echo "Missing AU component: $au" >&2; exit 1; }
          ditto "$vst3" "$stage/VST3/MakosizerX.vst3"
          ditto "$au" "$stage/Audio Unit/MakosizerX.component"
          if [[ -d "$standalone" ]]; then
            mkdir -p "$stage/Standalone"
            ditto "$standalone" "$stage/Standalone/MakosizerX.app"
          fi
          cp LICENSE README.md "$stage/"

          mkdir -p dist/macos
          ditto -c -k --sequesterRsrc --keepParent "$stage" \
            dist/macos/MakosizerX-macOS.zip
          unzip -tq dist/macos/MakosizerX-macOS.zip
          test -s dist/macos/MakosizerX-macOS.zip

          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" \
                && -n "$MACOS_CERTIFICATE_P12_BASE64" \
                && -n "$MACOS_CERTIFICATE_PASSWORD" \
                && -n "$MACOS_SIGNING_IDENTITY" ]]; then
            xcrun notarytool submit dist/macos/MakosizerX-macOS.zip \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait
          else
            echo "Notarization credentials or signing identity are unavailable; skipping notarization."
          fi

      - name: Verify universal plugin architectures
        shell: bash
        run: |
          set -euo pipefail
          for bundle in \
            build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3 \
            build/MakosizerX_artefacts/Release/AU/MakosizerX.component; do
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
              "$bundle/Contents/Info.plist")
            binary="$bundle/Contents/MacOS/$executable"
            architectures="$(lipo -archs "$binary")"
            [[ " $architectures " == *" arm64 "* ]] || {
              echo "Missing arm64 architecture in $binary: $architectures" >&2
              exit 1
            }
            [[ " $architectures " == *" x86_64 "* ]] || {
              echo "Missing x86_64 architecture in $binary: $architectures" >&2
              exit 1
            }
          done

      - name: Upload macOS build bundles
        uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-macOS-Build
          path: |
            build/MakosizerX_artefacts/Release/VST3/MakosizerX.vst3
            build/MakosizerX_artefacts/Release/AU/MakosizerX.component
            build/MakosizerX_artefacts/Release/Standalone/MakosizerX.app
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: MakosizerX-macOS-Packages
          path: dist/macos/MakosizerX-macOS.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [version, linux, windows, macos]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: MakosizerX-Linux-Packages
          path: release-assets/linux

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: MakosizerX-Windows-Packages
          path: release-assets/windows

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: MakosizerX-macOS-Packages
          path: release-assets/macos

      - name: Generate release notes and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mkdir -p release-assets/changelog
          notes_json="$RUNNER_TEMP/makosizerx-release-notes.json"
          notes_file="$RUNNER_TEMP/makosizerx-release-notes.md"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_REF_NAME" > "$notes_json"
          jq -r '.body // ""' "$notes_json" > "$notes_file"
          {
            printf '# MakosizerX %s\n\n' "$tag"
            cat "$notes_file"
          } > release-assets/changelog/MakosizerX-CHANGELOG.md

          required=(
            release-assets/linux/MakosizerX-Linux.zip
            release-assets/linux/MakosizerX-Linux.tar.gz
            release-assets/windows/MakosizerX-Windows.zip
            'release-assets/windows/MakosizerX Setup.exe'
            release-assets/macos/MakosizerX-macOS.zip
          )
          for asset in "${required[@]}"; do
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

      - name: Create or update published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          assets=(
            release-assets/linux/MakosizerX-Linux.zip
            release-assets/linux/MakosizerX-Linux.tar.gz
            release-assets/windows/MakosizerX-Windows.zip
            'release-assets/windows/MakosizerX Setup.exe'
            release-assets/macos/MakosizerX-macOS.zip
            release-assets/changelog/MakosizerX-CHANGELOG.md
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "MakosizerX $tag" \
              --notes-file "$RUNNER_TEMP/makosizerx-release-notes.md"
            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "MakosizerX $tag" \
              --notes-file "$RUNNER_TEMP/makosizerx-release-notes.md"
          fi
